[project]
name = "kronos-forecast-service"
version = "0.1.0"
description = "CPU inference service for Kronos candlestick forecasts"
requires-python = ">=3.11"
dependencies = [
  "einops==0.8.1",
  "fastapi>=0.115",
  "huggingface-hub==0.33.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "safetensors==0.6.2",
  "torch",
  "tqdm>=4.66",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
